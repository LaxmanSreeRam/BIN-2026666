<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="darkGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#0d141b" />
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#162330" stroke-width="1" />
    </pattern>

    <!-- Emerald Leaf Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="leafBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="circuitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="recycleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.06   0 0 0 0 0.72   0 0 0 0 0.5   0 0 0 0.35 0"/>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#darkGrid)" rx="40" />

  <!-- Ambient background glow -->
  <circle cx="250" cy="210" r="160" fill="#059669" opacity="0.15" filter="blur(40px)" />

  <!-- Main Leaf & Circuits Group -->
  <g transform="translate(250, 205)" filter="url(#softGlow)">
    <!-- Leaf Stem -->
    <path d="M -85 115 C -95 135 -110 155 -125 170 C -120 170 -105 150 -95 130 Z" fill="#047857" />

    <!-- Leaf Body Outer Shadow/Border -->
    <path d="M -90 120 C -150 40 -130 -70 -30 -140 C 40 -120 120 -60 140 30 C 150 110 90 140 -20 140 C -55 140 -75 132 -90 120 Z" 
          fill="none" stroke="url(#leafBorder)" stroke-width="14" stroke-linejoin="round" />

    <!-- Leaf Inner Base -->
    <path d="M -87 117 C -145 40 -125 -65 -30 -134 C 36 -115 114 -58 134 28 C 143 103 86 133 -19 133 C -53 133 -72 127 -87 117 Z" 
          fill="#06231a" />

    <!-- Central Diagonal Spine -->
    <path d="M -85 115 L 75 -95" stroke="url(#circuitGlow)" stroke-width="5" stroke-linecap="round" />

    <!-- Left Side Circuit Traces -->
    <!-- Trace 1 -->
    <path d="M -70 95 L -70 70 L -105 45 L -105 20" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="-105" cy="15" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Trace 2 -->
    <path d="M -50 70 L -50 40 L -90 0 L -90 -30" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="-90" cy="-35" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Trace 3 -->
    <path d="M -20 30 L -20 0 L -60 -45 L -60 -75" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="-60" cy="-80" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Trace 4 -->
    <path d="M 15 -15 L 15 -45 L -20 -85 L -20 -110" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="-20" cy="-115" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Right Side Circuit Traces -->
    <!-- Right Trace 1 (Top) -->
    <path d="M 45 -55 L 75 -55 L 105 -25 L 105 0" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="105" cy="5" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Right Trace 2 (Middle) -->
    <path d="M 10 -10 L 45 -10 L 80 15 L 100 15" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="105" cy="15" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Right Trace 3 (Lower connection) -->
    <path d="M -30 45 L 0 45 L 20 65" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="25" cy="65" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- Right Trace 4 (Bottom) -->
    <path d="M -60 85 L -10 85 L 10 105" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="15" cy="105" r="5" fill="#6ee7b7" stroke="#064e3b" stroke-width="2" />

    <!-- 3D Recycling Chasing Arrows Symbol (Lower Right of Leaf) -->
    <g transform="translate(55, 65) scale(0.85)" filter="url(#glow)">
      <!-- Arrow 1 (Top / Right) -->
      <path d="M -15 -35 L 15 -35 L 20 -25 L -5 -25 Z" fill="url(#recycleGrad)" />
      <polygon points="12,-43 28,-30 12,-17" fill="url(#recycleGrad)" />

      <!-- Arrow 2 (Right / Bottom) -->
      <path d="M 25 -10 L 10 20 L 2 15 L 14 -10 Z" fill="url(#recycleGrad)" />
      <polygon points="20,24 0,32 7,12" fill="url(#recycleGrad)" />

      <!-- Arrow 3 (Bottom / Left) -->
      <path d="M -5 20 L -25 -10 L -17 -15 L 0 10 Z" fill="url(#recycleGrad)" />
      <polygon points="-32,-6 -26,-26 -12,-16" fill="url(#recycleGrad)" />
    </g>
  </g>

  <!-- Typography: VERDETECH -->
  <g transform="translate(250, 420)">
    <!-- Glow effect behind text -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="42" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#10b981" 
          text-anchor="middle" 
          opacity="0.6" 
          filter="url(#glow)">VERDETECH</text>

    <!-- Sharp front text -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="42" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#f0fdf4" 
          text-anchor="middle">VERDETECH</text>
  </g>
</svg>